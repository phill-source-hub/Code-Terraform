# Conservative Ruff config. The game's own generated config was not present in the
# repo, and the game only applies a ruff.toml that lives in its scripts folder or
# above it, so this file governs the repo only.
line-length = 100
target-version = "py312"
# Owner copies must stay byte-identical to the game files (no trailing newline, no reformat).
exclude = ["scripts/owner"]
# Game-provided names that are not CPython builtins. Declared so F821 (undefined
# name) does not fire on game scripts. Add a name only when its stub line is
# recorded in docs/api-notes.md. The harness (tests/harness) is the runtime check.
builtins = ["get_component", "get_game_version", "set_status", "notify", "sleep", "warn"]

# Game scripts run in a Python-like interpreter, not CPython. Keep the rules that
# catch real bugs; skip the style-only groups that fight the game's idioms.
[lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = []

[lint.per-file-ignores]
# Tests import modules by path (see tests/harness), which trips E402.
"tests/**" = ["E402"]
# Contract and machine scripts run with `self` (the owner) injected by the game. Ruff cannot see it.
"scripts/contracts/**" = ["F821"]
"scripts/main/**" = ["F821"]
# Templates generate scripts/main files, so they carry the same injected `self`.
"scripts/templates/**" = ["F821"]
# Owner-written game scripts, copied verbatim (not ours to edit). Same injected names as above.
"scripts/owner/**" = ["F821"]
"scripts/automations/**" = ["F821"]
# Probes run in game on a machine or a Control Room card, so they use the injected `self` or `panel`.
"scripts/probes/**" = ["F821"]

[format]
quote-style = "double"
